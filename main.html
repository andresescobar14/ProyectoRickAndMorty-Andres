<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-blue-600 min-h-screen flex flex-col font-sans">
  
  <header class="bg-gray-900 text-white p-4 flex justify-between items-center shadow-md">
    <h1 class="text-xl font-bold">Rick and Morty App</h1>
    <div class="flex items-center gap-4">
      <span id="displayNombre" class="font-medium text-gray-200"></span>
      <!-- Nuevo botón hacia Mi Cuenta -->
      <a href="account.html" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-bold transition duration-300">
        <i class="fa-solid fa-user mr-1"></i> Mi Cuenta
      </a>
      <button id="btnCerrarSesion" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-bold transition duration-300 cursor-pointer">
        <i class="fa-solid fa-power-off mr-1"></i> Salir
      </button>
    </div>
  </header>

  <main id="contenedorPersonajes" class="grid grid-cols-1 lg:grid-cols-3 gap-4 p-4 flex-grow">
    <!-- Tarjetas -->
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. Proteger ruta con nombre no genérico
      const estadoSesionActiva = sessionStorage.getItem("estadoSesionActiva");
      if (!estadoSesionActiva) {
        window.location.href = "login.html"; 
        return;
      }

      // 2. Mostrar datos
      const nombreUsuario = sessionStorage.getItem("nombreUsuario") || "Usuario";
      document.getElementById("displayNombre").textContent = `Hola, ${nombreUsuario}`;

      // 3. Cerrar sesión
      const btnCerrarSesion = document.getElementById("btnCerrarSesion");
      btnCerrarSesion.addEventListener("click", () => {
        sessionStorage.removeItem("estadoSesionActiva");
        sessionStorage.removeItem("usuarioLogueado");
        sessionStorage.removeItem("nombreUsuario");
        window.location.href = "login.html";
      });

      // 4. Lógica de personajes
      const usuarioLogueado = sessionStorage.getItem("usuarioLogueado");
      const claveFavoritos = usuarioLogueado ? `favoritos_${usuarioLogueado}` : 'favoritos';

      async function traerPersonajes() {
        let personajes = await fetch(`https://rickandmortyapi.com/api/character`)
          .then((data) => data.json());

        let favoritos = JSON.parse(localStorage.getItem(claveFavoritos)) || [];
        let contenido = document.getElementById("contenedorPersonajes"); 
        
        personajes.results.forEach((personaje) => {
          let tarjeta = document.createElement("div");
          const esFavorito = favoritos.some(fav => fav.id === personaje.id);

          tarjeta.innerHTML = `
            <a href="./character.html?id=${personaje.id}" class="block h-full">
              <img src="${personaje.image}" alt="${personaje.name}" class="w-full h-48 object-cover object-top" />
              <div class="p-4 flex flex-col">
                <h2 class="text-xl font-bold">${personaje.name}</h2>
                <div class="flex items-center justify-between mt-1">
                  <p class="text-gray-300 text-sm font-medium">${personaje.status} - ${personaje.species}</p>
                  <button class="btn-favorito relative z-10 text-xl hover:scale-125 transition-transform p-1 cursor-pointer">
                    <i class="${esFavorito ? 'fa-star fa-solid text-yellow-400' : 'fa-star fa-regular text-gray-400'}" id="icono"></i>
                  </button>
                </div>
              </div>
            </a>
          `;
          tarjeta.className = "bg-black text-white rounded-xl overflow-hidden shadow-xl border border-gray-800 flex flex-col relative transition transform hover:-translate-y-1 hover:shadow-2xl";
          contenido.appendChild(tarjeta);

          const btnFavorito = tarjeta.querySelector(".btn-favorito");
          const icono = tarjeta.querySelector("i");

          btnFavorito.addEventListener("click", (e) => {
            e.preventDefault(); 
            e.stopPropagation();
            
            let listaFavoritos = JSON.parse(localStorage.getItem(claveFavoritos)) || [];
            const yaExiste = listaFavoritos.some(fav => fav.id === personaje.id);

            if (yaExiste) {
              listaFavoritos = listaFavoritos.filter(fav => fav.id !== personaje.id);
              icono.className = "fa-star fa-regular text-gray-400";
            } else {
              listaFavoritos.push(personaje);
              icono.className = "fa-star fa-solid text-yellow-400";
            }
            
            localStorage.setItem(claveFavoritos, JSON.stringify(listaFavoritos));
          });
        });
      }
      traerPersonajes();
    });
  </script>
</body>
</html>
