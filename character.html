<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Personaje</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4 lg:p-8 font-sans">
  
  <div id="tarjeta" class="w-full max-w-4xl">
    <h1 class="text-white text-center text-2xl font-bold animate-pulse">Cargando información a través de portales...</h1>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Proteger ruta
      const estadoSesionActiva = sessionStorage.getItem("estadoSesionActiva");
      if (!estadoSesionActiva) {
        window.location.href = "login.html"; 
        return;
      }

      const usuarioLogueado = sessionStorage.getItem("usuarioLogueado");
      const claveFavoritos = usuarioLogueado ? `favoritos_${usuarioLogueado}` : 'favoritos';

      try {
        const tarjeta = document.getElementById("tarjeta");
        
        async function traerPersonaje(id) {
          let personaje = await fetch(`https://rickandmortyapi.com/api/character/${id}`)
            .then((data) => data.json());
          
          if (personaje.error) {
            tarjeta.innerHTML = `
              <div class="bg-red-500/10 border border-red-500 text-red-500 p-6 rounded-xl text-center">
                <h1 class="text-3xl font-black mb-2">¡Error 404!</h1>
                <p>Personaje no encontrado en este universo.</p>
                <a href="main.html" class="inline-block mt-4 text-white bg-red-600 hover:bg-red-700 px-6 py-2 rounded-lg font-bold">Regresar</a>
              </div>`;
          } else {
            let colorEstado = "bg-gray-500";
            if (personaje.status === "Alive") colorEstado = "bg-green-500";
            if (personaje.status === "Dead") colorEstado = "bg-red-500";

            let numEpisodios = personaje.episode.length;
            let favoritosGuardados = JSON.parse(localStorage.getItem(claveFavoritos)) || [];
            const esFavorito = favoritosGuardados.some(fav => fav.id === personaje.id);

            tarjeta.innerHTML = `
              <div class="bg-gray-800 rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row w-full border border-gray-700">
                <div class="md:w-1/2">
                  <img src="${personaje.image}" alt="${personaje.name}" class="w-full h-full min-h-[300px] object-cover" />
                </div>
                <div class="p-6 md:p-8 md:w-1/2 flex flex-col justify-center">
                  <div class="mb-6 flex justify-between items-start gap-4">
                    <div>
                      <h1 class="text-4xl md:text-5xl font-black text-white mb-2 leading-tight">${personaje.name}</h1>
                      <div class="flex items-center gap-2 text-lg text-white font-medium">
                        <span class="w-3 h-3 rounded-full ${colorEstado} shadow-[0_0_8px_${colorEstado}]"></span>
                        <span>${personaje.status} - ${personaje.species}</span>
                      </div>
                    </div>
                    <button id="btnFavoritoDetalle" class="text-4xl hover:scale-110 transition-transform cursor-pointer focus:outline-none shrink-0">
                      <i class="${esFavorito ? 'fa-star fa-solid text-yellow-400' : 'fa-star fa-regular text-gray-400'}" id="iconoDetalle"></i>
                    </button>
                  </div>
                  
                  <div class="grid grid-cols-2 gap-4 mb-8">
                    <div class="bg-gray-900/50 p-3 rounded-xl border border-gray-700">
                      <p class="text-gray-400 text-xs uppercase font-bold tracking-wider mb-1">Género</p>
                      <p class="text-white text-lg font-semibold">${personaje.gender}</p>
                    </div>
                    <div class="bg-gray-900/50 p-3 rounded-xl border border-gray-700">
                      <p class="text-gray-400 text-xs uppercase font-bold tracking-wider mb-1">Apariciones</p>
                      <p class="text-white text-lg font-semibold">${numEpisodios} episodio(s)</p>
                    </div>
                    <div class="col-span-2 bg-gray-900/50 p-3 rounded-xl border border-gray-700">
                      <p class="text-gray-400 text-xs uppercase font-bold tracking-wider mb-1">Lugar de origen</p>
                      <p class="text-white text-lg font-semibold">${personaje.origin.name}</p>
                    </div>
                    <div class="col-span-2 bg-gray-900/50 p-3 rounded-xl border border-gray-700">
                      <p class="text-gray-400 text-xs uppercase font-bold tracking-wider mb-1">Ubicación actual</p>
                      <p class="text-white text-lg font-semibold">${personaje.location.name}</p>
                    </div>
                  </div>
                  <a href="main.html" class="mt-auto bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl text-center transition-colors shadow-lg hover:shadow-blue-500/50">
                    <i class="fa-solid fa-arrow-left mr-2"></i> Volver al listado
                  </a>
                </div>
              </div>
            `;

            const btnFavorito = document.getElementById("btnFavoritoDetalle");
            const icono = document.getElementById("iconoDetalle");

            btnFavorito.addEventListener("click", () => {
              let listaFavoritos = JSON.parse(localStorage.getItem(claveFavoritos)) || [];
              const yaExiste = listaFavoritos.some(fav => fav.id === personaje.id);

              if (yaExiste) {
                listaFavoritos = listaFavoritos.filter(fav => fav.id !== personaje.id);
                icono.className = "fa-star fa-regular text-gray-400";
              } else {
                listaFavoritos.push(personaje);
                icono.className = "fa-star fa-solid text-yellow-400";
              }
              localStorage.setItem(claveFavoritos, JSON.stringify(listaFavoritos));
            });
          }
        }

        const url = window.location.search;
        const contenidoUrl = new URLSearchParams(url);
        const valorId = contenidoUrl.get("id");
        
        if (!valorId) {
          tarjeta.innerHTML = `
            <div class="bg-red-500/10 border border-red-500 text-red-500 p-6 rounded-xl text-center">
              <h1 class="text-2xl font-bold mb-2">Error de navegación</h1>
              <p>Falta el ID del personaje en la URL.</p>
              <a href="main.html" class="inline-block mt-4 text-white bg-red-600 hover:bg-red-700 px-6 py-2 rounded-lg font-bold">Regresar</a>
            </div>`;
        } else {
          traerPersonaje(valorId);
        }
      } catch (error) {
        document.getElementById("tarjeta").innerHTML = `
          <div class="text-red-500 text-center bg-gray-800 p-6 rounded-xl">
            <h1 class="text-2xl font-bold">Ops, hubo un error de conexión</h1>
          </div>`;
      }
    });
  </script>
</body>
</html>
